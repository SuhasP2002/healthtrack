server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/healthtrack_db
spring.datasource.username=healthtrack_user
spring.datasource.password=healthtrack_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=healthtrack-super-secret-jwt-key-2024-make-it-long-and-secure-for-production
app.jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:3000,http://localhost,http://frontend:3000
app.frontend.url=http://localhost:3000

# Gmail SMTP — for password reset emails
# 1. Go to Google Account > Security > 2-Step Verification > App Passwords
# 2. Generate App Password for "Mail"
# 3. Replace values below
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.com.healthtrack=DEBUG
